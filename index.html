<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JurisAI - Gestão Jurídica Inteligente</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            color: var(--primary);
            margin: 0 0 4px 0;
            font-size: 24px;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .card h3 {
            margin-top: 0;
            font-size: 16px;
            color: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            background: #d1fae5;
            color: #065f46;
        }

        .lista-itens {
            list-style: none;
            padding: 0;
            margin: 12px 0 0 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .item-registo {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-registo:last-child {
            border-bottom: none;
        }

        .item-nome {
            font-weight: 600;
            color: var(--text-main);
        }

        .item-data {
            font-size: 11px;
            color: var(--text-muted);
        }

        .vazio {
            text-align: center;
            color: var(--text-muted);
            padding: 12px;
            font-style: italic;
        }

        .divider {
            margin: 20px 0;
            border: 0;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>JurisAI</h1>
            <p>Plataforma de Gestão e Inteligência Jurídica</p>
        </header>

        <!-- SECÇÃO 1: TENENTES -->
        <div class="card">
            <h3>Novo Tenente</h3>
            <input type="text" id="nome-tenente" placeholder="Nome do tenente ou cliente...">
            <button onclick="inserirTenente()">Guardar Tenente</button>
        </div>

        <div class="card">
            <h3>
                <span>Tenentes Registados</span>
                <span id="badge-total-tenentes" class="status-badge">0</span>
            </h3>
            <div id="conteudo-lista-tenentes">
                <p class="vazio">A carregar...</p>
            </div>
        </div>

        <hr class="divider">

        <!-- SECÇÃO 2: CASOS JURÍDICOS -->
        <div class="card">
            <h3>Novo Caso Jurídico</h3>
            <input type="text" id="titulo-caso" placeholder="Título ou descrição do caso...">
            <button onclick="inserirCaso()" style="background: #0f766e;">Guardar Caso</button>
        </div>

        <div class="card">
            <h3>
                <span>Casos Registados</span>
                <span id="badge-total-casos" class="status-badge" style="background: #ccfbf1; color: #115e59;">0</span>
            </h3>
            <div id="conteudo-lista-casos">
                <p class="vazio">A carregar...</p>
            </div>
        </div>
    </div>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = 'https://vwqzrhybemvhqsbsbfjp.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3cXpyaHliZW12aHFzYnNiZmpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMTcwNzYsImV4cCI6MjA1Njc5MzA3Nn0.vRzSL2K06WzX9V8c9p5Q1...'; // Mantenha a sua chave JWT legacy ativa

      const { createClient } = supabase;
      const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // --- CARREGAR DADOS ---
      async function carregarTudo() {
        await carregarTenentes();
        await carregarCasos();
      }

      async function carregarTenentes() {
        const listaEl = document.getElementById('conteudo-lista-tenentes');
        const badgeEl = document.getElementById('badge-total-tenentes');

        const { data, error } = await _supabase
          .from('tenentes')
          .select('*')
          .order('created_at', { ascending: false });
        
        if (error) {
          listaEl.innerHTML = `<p class="vazio" style="color: red;">Erro: ${error.message}</p>`;
          return;
        }

        badgeEl.innerText = data.length;

        if (data.length === 0) {
          listaEl.innerHTML = `<p class="vazio">Nenhum registo.</p>`;
          return;
        }

        let html = '<ul class="lista-itens">';
        data.forEach(item => {
          const dataF = item.created_at ? new Date(item.created_at).toLocaleString('pt-PT') : '';
          html += `<li class="item-registo"><span class="item-nome">${item.name || 'Sem nome'}</span><span class="item-data">${dataF}</span></li>`;
        });
        html += '</ul>';
        listaEl.innerHTML = html;
      }

      async function carregarCasos() {
        const listaEl = document.getElementById('conteudo-lista-casos');
        const badgeEl = document.getElementById('badge-total-casos');

        // Acedendo à tabela 'Case' com C maiúsculo
        const { data, error } = await _supabase
          .from('Case')
          .select('*')
          .order('created_at', { ascending: false });
        
        if (error) {
          listaEl.innerHTML = `<p class="vazio" style="color: red;">Erro: ${error.message}</p>`;
          return;
        }

        badgeEl.innerText = data.length;

        if (data.length === 0) {
          listaEl.innerHTML = `<p class="vazio">Nenhum caso registado.</p>`;
          return;
        }

        let html = '<ul class="lista-itens">';
        data.forEach(item => {
          const dataF = item.created_at ? new Date(item.created_at).toLocaleString('pt-PT') : '';
          const titulo = item.title || item.name || 'Caso sem título';
          html += `<li class="item-registo"><span class="item-nome">${titulo}</span><span class="item-data">${dataF}</span></li>`;
        });
        html += '</ul>';
        listaEl.innerHTML = html;
      }

      // --- INSERIR DADOS ---
      async function inserirTenente() {
        const input = document.getElementById('nome-tenente');
        const valor = input.value.trim();
        if (!valor) return alert('Escreva o nome do tenente.');

        const { error } = await _supabase.from('tenentes').insert([{ name: valor }]);
        if (error) alert('Erro: ' + error.message);
        else { input.value = ''; carregarTenentes(); }
      }

      async function inserirCaso() {
        const input = document.getElementById('titulo-caso');
        const valor = input.value.trim();
        if (!valor) return alert('Escreva o título do caso.');

        // Inserindo na tabela 'Case' com C maiúsculo
        const { error } = await _supabase.from('Case').insert([{ title: valor }]);
        if (error) {
          alert('Erro ao inserir caso: ' + error.message);
        } else {
          input.value = '';
          carregarCasos();
        }
      }

      carregarTudo();
    </script>
</body>
</html>
